<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Run Dashboard</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='1' y='8' width='3' height='7' rx='1' fill='%232a78d6'/%3E%3Crect x='6.5' y='4' width='3' height='11' rx='1' fill='%232a78d6'/%3E%3Crect x='12' y='1' width='3' height='14' rx='1' fill='%232a78d6'/%3E%3C/svg%3E">
<style>
  /* Colors by role; light and dark are each their own validated steps (dataviz reference palette). */
  :root {
    color-scheme: light;
    --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
    --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11,11,11,0.10); --wash: rgba(11,11,11,0.04);
    --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4;
    --good-text: #006300; --bad-text: #b02c2c;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
      --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10); --wash: rgba(255,255,255,0.05);
      --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181;
      --good-text: #0ca30c; --bad-text: #e66767;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10); --wash: rgba(255,255,255,0.05);
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181;
    --good-text: #0ca30c; --bad-text: #e66767;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--ink);
         font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1180px; margin: 0 auto; padding: 20px 16px 48px; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; margin-bottom: 16px; }
  h1 { font-size: 20px; font-weight: 600; margin: 0; }
  .sub { color: var(--ink-2); font-size: 13px; }
  select { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--border);
           border-radius: 8px; padding: 6px 8px; max-width: 100%; }
  .pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600;
          padding: 3px 10px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); }
  .pill .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .pill.live .dot { background: var(--good-text); animation: pulse 1.6s infinite; }
  @keyframes pulse { 50% { opacity: .35; } }
  @media (prefers-reduced-motion: reduce) { .pill.live .dot { animation: none; } }
  .spacer { flex: 1; }

  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; min-width: 0; }
  .kpi .label { color: var(--ink-2); font-size: 12px; font-weight: 600; }
  .kpi .value { font-size: 26px; font-weight: 600; margin-top: 4px; letter-spacing: -0.01em; }
  .kpi .note { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .meter { height: 6px; border-radius: 3px; background: var(--grid); margin-top: 10px; overflow: hidden; }
  .meter > div { height: 100%; background: var(--s1); border-radius: 3px; }

  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 12px; margin-bottom: 16px; }
  h2 { font-size: 14px; font-weight: 600; margin: 0 0 2px; }
  .card .head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--ink-2); margin: 4px 0 8px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .sw { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
  button.link { font: inherit; font-size: 12px; color: var(--ink-2); background: none; border: 1px solid var(--border);
                border-radius: 6px; padding: 2px 8px; cursor: pointer; margin-left: auto; }
  svg { display: block; width: 100%; overflow: visible; }
  svg text { fill: var(--muted); font-size: 11px; }
  .empty { color: var(--muted); padding: 24px 0; text-align: center; }

  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  th { text-align: left; color: var(--ink-2); font-weight: 600; padding: 6px 8px; border-bottom: 1px solid var(--axis); white-space: nowrap; }
  td { padding: 6px 8px; border-bottom: 1px solid var(--grid); vertical-align: top; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  td.case { word-break: break-all; min-width: 160px; }
  .scroll { overflow-x: auto; }
  .tip { position: fixed; pointer-events: none; z-index: 10; background: var(--surface); color: var(--ink);
         border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 12px;
         box-shadow: 0 4px 16px rgba(0,0,0,.12); max-width: 300px; display: none; }
  .tip b { font-weight: 600; }
  footer { color: var(--muted); font-size: 12px; margin-top: 16px; }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>Run dashboard</h1>
      <div class="sub" id="subtitle">Loading…</div>
    </div>
    <div class="spacer"></div>
    <span class="pill" id="status"><span class="dot"></span><span id="status-text">…</span></span>
    <select id="run" aria-label="Run"></select>
  </header>

  <section class="kpis" id="kpis"></section>

  <section class="card" style="margin-bottom:16px">
    <div class="head"><h2>Outcomes by pair family</h2><span class="sub">calls so far, stacked by result</span>
      <button class="link" id="toggle-table">Show table</button></div>
    <div class="legend" id="legend"></div>
    <div id="families"></div>
    <div id="families-table" class="scroll" hidden></div>
  </section>

  <section class="grid2">
    <div class="card"><div class="head"><h2>Seconds per call</h2><span class="sub">a rise can mean the GPU is running hot</span></div>
      <div id="seconds"></div></div>
    <div class="card"><div class="head"><h2>Watts per call</h2><span class="sub">average draw during each call</span></div>
      <div id="watts"></div></div>
  </section>

  <section class="card">
    <div class="head"><h2>Latest calls</h2><span class="sub">newest first</span></div>
    <div class="scroll" id="latest"></div>
  </section>

  <footer id="footer"></footer>
</main>
<div class="tip" id="tip"></div>

<script>
const POLL_MS = 5000;
const OUTCOME_COLORS = ["var(--s1)", "var(--s2)", "var(--s3)", "var(--s4)", "var(--s5)"];  // fixed order
let selected = null, data = null, showTable = false;

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const money = (v, d = 2) => v == null ? "–" : "$" + (Math.abs(v) < 0.01 && v !== 0 ? v.toFixed(4) : v.toFixed(d));
const pct = (k, n) => n ? Math.round(100 * k / n) + "%" : "–";
function duration(s) {
  if (s == null) return "–";
  if (s < 60) return Math.round(s) + " s";
  const h = Math.floor(s / 3600), m = Math.round((s % 3600) / 60);
  return h ? `${h} h ${m} m` : `${m} min`;
}
const familyName = f => f.replace(/_/g, " ");

// ── tooltip ──
const tip = $("tip");
function showTip(html, x, y) {
  tip.innerHTML = html; tip.style.display = "block";
  const w = tip.offsetWidth, h = tip.offsetHeight;
  tip.style.left = Math.min(x + 14, innerWidth - w - 8) + "px";
  tip.style.top = Math.min(y + 14, innerHeight - h - 8) + "px";
}
const hideTip = () => tip.style.display = "none";

// ── headline numbers ──
function tile(label, value, note, meter) {
  return `<div class="card kpi"><div class="label">${label}</div><div class="value">${value}</div>` +
         (note ? `<div class="note">${note}</div>` : "") +
         (meter != null ? `<div class="meter"><div style="width:${Math.min(100, meter)}%"></div></div>` : "") + `</div>`;
}
function renderKpis(d) {
  const t = d.totals, pa = t.paired_accuracy || {};
  const ok = d.calls.filter(c => c.outcome !== "generation_failed").length;
  const tiles = [
    tile("Progress", `${d.calls_done} / ${d.planned_calls}`,
         d.calls_left ? `about ${duration(d.eta_seconds)} left at ${d.seconds_per_call ?? "–"} s/call` : "all calls made",
         d.planned_calls ? 100 * d.calls_done / d.planned_calls : 0),
    tile("Correct answers", pct(t.semantic_ok, ok), `${t.semantic_ok} of ${ok} answered` +
         (t.failed_calls ? `, ${t.failed_calls} calls failed` : "")),
    tile("Pairs passed", pa.scored ? pct(pa.passed, pa.scored) : "–",
         pa.scored ? `${pa.passed} of ${pa.scored}` + (pa.ci95 ? `, 95% CI ${Math.round(pa.ci95[0]*100)}–${Math.round(pa.ci95[1]*100)}%` : "")
                   : "a pair counts once both halves have run"),
  ];
  if (t.energy_wh != null) {
    tiles.push(tile("Electricity", money(t.energy_usd, 4),
      `${t.energy_wh >= 1000 ? (t.energy_wh / 1000).toFixed(2) + " kWh" : t.energy_wh.toFixed(1) + " Wh"} at $${t.kwh_price_usd}/kWh`));
  }
  if (t.projected_usd != null) {
    tiles.push(tile("On OpenRouter, as sent", money(t.projected_usd),
      `priced as ${esc(t.price_as)}; one small opening per pair`));
  }
  if (t.whole_tally_estimate_usd != null) {
    tiles.push(tile("The real experiment", money(t.whole_tally_estimate_usd),
      "estimate: all these cases in one whole-tally session on OpenRouter"));
  }
  if (d.backend !== "lmstudio") tiles.push(tile("Billed", money(t.billed_usd), "what OpenRouter charged"));
  $("kpis").innerHTML = tiles.join("");
}

// ── outcomes by family: horizontal stacked bars ──
function renderFamilies(d) {
  const fams = Object.keys(d.families).sort();
  $("legend").innerHTML = d.outcomes.map((o, i) =>
    `<span><i class="sw" style="background:${OUTCOME_COLORS[i]}"></i>${esc(d.outcome_labels[o])}</span>`).join("");
  if (!fams.length) { $("families").innerHTML = `<div class="empty">No calls yet.</div>`; $("families-table").innerHTML = ""; return; }
  const W = Math.max(320, $("families").clientWidth), labelW = 112, countW = 44, rowH = 26, barH = 16;
  const totals = fams.map(f => d.outcomes.reduce((s, o) => s + (d.families[f][o] || 0), 0));
  const max = Math.max(...totals), x = v => (W - labelW - countW) * v / max;
  let svg = `<svg viewBox="0 0 ${W} ${fams.length * rowH}" height="${fams.length * rowH}" role="img" aria-label="Outcomes by pair family">`;
  fams.forEach((f, r) => {
    const y = r * rowH + (rowH - barH) / 2;
    svg += `<text x="0" y="${y + barH - 4}" style="fill:var(--ink-2)">${esc(familyName(f))}</text>`;
    let at = labelW;
    const segs = d.outcomes.map((o, i) => ({o, i, n: d.families[f][o] || 0})).filter(s => s.n);
    segs.forEach((s, k) => {
      const w = x(s.n), gap = k < segs.length - 1 ? 2 : 0;        // a 2px surface gap between segments
      const first = k === 0, last = k === segs.length - 1, rx = 4;
      // rounded only at the bar's two ends
      const path = `M${at + (first ? rx : 0)},${y} H${at + w - gap - (last ? rx : 0)}` +
        (last ? ` Q${at + w - gap},${y} ${at + w - gap},${y + rx} V${y + barH - rx} Q${at + w - gap},${y + barH} ${at + w - gap - rx},${y + barH}` : ` V${y + barH}`) +
        ` H${at + (first ? rx : 0)}` + (first ? ` Q${at},${y + barH} ${at},${y + barH - rx} V${y + rx} Q${at},${y} ${at + rx},${y}` : ` V${y}`) + "Z";
      svg += `<path d="${path}" fill="${OUTCOME_COLORS[s.i]}" data-tip="<b>${esc(familyName(f))}</b><br>${esc(d.outcome_labels[s.o])}: ${s.n} of ${totals[r]}"></path>`;
      // a transparent, taller hit target over the segment
      svg += `<rect x="${at}" y="${r * rowH}" width="${Math.max(w, 6)}" height="${rowH}" fill="transparent" data-tip="<b>${esc(familyName(f))}</b><br>${esc(d.outcome_labels[s.o])}: ${s.n} of ${totals[r]}"></rect>`;
      at += w;
    });
    svg += `<text x="${W - countW + 8}" y="${y + barH - 4}" style="fill:var(--ink-2)">${totals[r]}</text>`;
  });
  $("families").innerHTML = svg + "</svg>";
  $("families").querySelectorAll("[data-tip]").forEach(el => {
    el.addEventListener("mousemove", e => showTip(el.dataset.tip, e.clientX, e.clientY));
    el.addEventListener("mouseleave", hideTip);
  });
  $("families-table").innerHTML = `<table><tr><th>Family</th>${d.outcomes.map(o => `<th class="num">${esc(d.outcome_labels[o])}</th>`).join("")}<th class="num">Calls</th></tr>` +
    fams.map((f, r) => `<tr><td>${esc(familyName(f))}</td>${d.outcomes.map(o => `<td class="num">${d.families[f][o] || 0}</td>`).join("")}<td class="num">${totals[r]}</td></tr>`).join("") + "</table>";
}

// ── a single-series line with a crosshair tooltip ──
function renderLine(el, points, unit, fmt) {
  const pts = points.filter(p => p.y != null);
  if (pts.length < 2) { el.innerHTML = `<div class="empty">${pts.length ? "One call so far." : "No calls yet."}</div>`; return; }
  const W = Math.max(300, el.clientWidth), H = 180, L = 40, R = 8, T = 8, B = 22;
  const xs = pts.map(p => p.x), ys = pts.map(p => p.y);
  const x0 = Math.min(...xs), x1 = Math.max(...xs), ymax = Math.max(...ys) * 1.1 || 1;
  const X = v => L + (W - L - R) * (v - x0) / (x1 - x0 || 1), Y = v => T + (H - T - B) * (1 - v / ymax);
  const tickText = v => ymax >= 10 ? Math.round(v) : v.toFixed(1);     // small ranges keep a decimal
  let svg = `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="${unit} per call">`;
  [0, ymax / 2, ymax].forEach(v => svg += `<line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--grid)"/>` +
                           `<text x="${L - 6}" y="${Y(v) + 4}" text-anchor="end">${tickText(v)}</text>`);
  svg += `<line x1="${L}" x2="${W - R}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--axis)"/>`;
  svg += `<text x="${L}" y="${H - 4}">call ${x0}</text><text x="${W - R}" y="${H - 4}" text-anchor="end">call ${x1}</text>`;
  svg += `<path d="${pts.map((p, i) => (i ? "L" : "M") + X(p.x).toFixed(1) + "," + Y(p.y).toFixed(1)).join(" ")}" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  svg += `<line class="cross" x1="0" x2="0" y1="${T}" y2="${H - B}" stroke="var(--axis)" visibility="hidden"/>`;
  svg += `<circle class="dot" r="4" fill="var(--s1)" stroke="var(--surface)" stroke-width="2" visibility="hidden"/>`;
  svg += `<rect x="${L}" y="0" width="${W - L - R}" height="${H}" fill="transparent" class="hit"/></svg>`;
  el.innerHTML = svg;
  const s = el.querySelector("svg"), cross = s.querySelector(".cross"), dot = s.querySelector(".dot");
  s.querySelector(".hit").addEventListener("mousemove", e => {
    const box = s.getBoundingClientRect(), vx = (e.clientX - box.left) * W / box.width;
    const p = pts.reduce((a, b) => Math.abs(X(b.x) - vx) < Math.abs(X(a.x) - vx) ? b : a);
    cross.setAttribute("x1", X(p.x)); cross.setAttribute("x2", X(p.x)); cross.setAttribute("visibility", "visible");
    dot.setAttribute("cx", X(p.x)); dot.setAttribute("cy", Y(p.y)); dot.setAttribute("visibility", "visible");
    showTip(`<b>Call ${p.x}</b> · ${esc(p.label)}<br>${fmt(p.y)}`, e.clientX, e.clientY);
  });
  s.querySelector(".hit").addEventListener("mouseleave", () => {
    cross.setAttribute("visibility", "hidden"); dot.setAttribute("visibility", "hidden"); hideTip();
  });
}

// ── latest calls ──
function renderLatest(d) {
  const rows = d.calls.slice(-20).reverse();
  if (!rows.length) { $("latest").innerHTML = `<div class="empty">No calls yet.</div>`; return; }
  const color = o => OUTCOME_COLORS[d.outcomes.indexOf(o)];
  $("latest").innerHTML = `<table><tr><th class="num">#</th><th>Case</th><th>Result</th><th class="num">Seconds</th>
    <th class="num">Watts</th><th class="num">Wh</th><th class="num">Tokens in / out</th><th class="num">OpenRouter</th></tr>` +
    rows.map(c => `<tr title="${esc(c.detail)}"><td class="num">${c.i}</td><td class="case">${esc(c.task_id)}</td>
      <td><span style="display:inline-flex;align-items:center;gap:6px;white-space:nowrap"><i class="sw" style="background:${color(c.outcome)}"></i>${esc(d.outcome_labels[c.outcome])}</span></td>
      <td class="num">${c.seconds}</td><td class="num">${c.watts != null ? Math.round(c.watts) : "–"}</td><td class="num">${c.wh != null ? c.wh.toFixed(3) : "–"}</td>
      <td class="num">${(c.prompt_tokens ?? 0).toLocaleString()} / ${(c.completion_tokens ?? 0).toLocaleString()}</td>
      <td class="num">${money(c.projected_usd, 4)}</td></tr>`).join("") + "</table>";
}

function render(d) {
  if (d.empty) {
    $("subtitle").textContent = `${d.file}: no runs yet. Start one; this page updates by itself.`;
    $("status-text").textContent = "Waiting"; $("status").className = "pill"; return;
  }
  const picker = $("run");
  picker.innerHTML = d.runs.map(r => `<option value="${esc(r.key)}"${r.key === d.run.key ? " selected" : ""}>${esc(r.label)}</option>`).join("");
  $("subtitle").textContent = `${d.model} via ${d.backend}, ${d.tally} tally · ${d.file}`;
  const idle = d.seconds_since_last_call, done = d.calls_left === 0;
  const live = !done && idle != null && idle < Math.max(600, 3 * (d.seconds_per_call || 0));
  $("status").className = "pill" + (live ? " live" : "");
  $("status-text").textContent = done ? "Finished" : live ? "Running" : `Idle for ${duration(idle)}`;
  renderKpis(d);
  renderFamilies(d);
  $("families-table").hidden = !showTable; $("families").hidden = showTable;
  renderLine($("seconds"), d.calls.map(c => ({x: c.i, y: c.seconds, label: c.task_id})), "Seconds", v => v.toFixed(1) + " s");
  renderLine($("watts"), d.calls.map(c => ({x: c.i, y: c.watts, label: c.task_id})), "Watts", v => Math.round(v) + " W");
  renderLatest(d);
  $("footer").textContent = `Updated ${new Date().toLocaleTimeString()} · refreshes every ${POLL_MS / 1000} s · served from this computer only`;
}

async function refresh() {
  try {
    const r = await fetch("/data" + (selected ? "?run=" + encodeURIComponent(selected) : ""), {cache: "no-store"});
    data = await r.json();
    if (!selected && data.run) selected = null;   // follow the newest run until one is picked
    render(data);
  } catch (e) {
    $("status-text").textContent = "Dashboard server stopped"; $("status").className = "pill";
  }
}
$("run").addEventListener("change", e => { selected = e.target.value; refresh(); });
$("toggle-table").addEventListener("click", () => {
  showTable = !showTable; $("toggle-table").textContent = showTable ? "Show chart" : "Show table";
  if (data) render(data);
});
addEventListener("resize", () => data && render(data));
refresh();
setInterval(refresh, POLL_MS);
</script>
</body>
</html>
